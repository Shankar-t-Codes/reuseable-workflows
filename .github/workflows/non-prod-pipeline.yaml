name: feature-nodejs-pipeline
on:
  workflow_call: # will be called by someone, should get inputs from caller
    inputs:
      version:
        required: true
        type: string
      environment:
        required: true
        type: string
env:
  ACC_ID: 367012942501

jobs:
  non-prod-gate:
    runs-on: self-hosted

    steps:
    - name: Compute short commit
      id: commit
      run: |
        SHORT_SHA="${{ inputs.version }}"
        APP_VERSION="${SHORT_SHA:0:9}"

        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "App version: $APP_VERSION"

    - name: Check required commit statuses
      id: gate
      shell: bash
      run: |
        echo "🔍 Checking commit statuses for ${{ inputs.version }}"

        REQUIRED_CONTEXTS=(
          "DEV_DEPLOY"
          "DOCKER_BUILD"
          "UNIT_TESTS"
          "SECURITY_CHECK"
        )

        RESPONSE=$(curl -s \
          -H "Authorization: Bearer ${{ github.token }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/commits/${{ inputs.version }}/statuses")

        FAILED=0

        for CONTEXT in "${REQUIRED_CONTEXTS[@]}"; do
          STATE=$(echo "$RESPONSE" | jq -r \
            ".[] | select(.context == \"$CONTEXT\") | .state" | head -n 1)

          if [ -z "$STATE" ]; then
            echo "❌ $CONTEXT → status missing"
            FAILED=1
          elif [ "$STATE" != "success" ]; then
            echo "❌ $CONTEXT → $STATE"
            FAILED=1
          else
            echo "✅ $CONTEXT → success"
          fi
        done

        if [ "$FAILED" -eq 1 ]; then
          echo "🚫 UAT gate failed"
          exit 1
        fi

        echo "🎉 All required checks passed"

    - name: deploy to ${{ input.environment }} cluster
      id: uat_deploy
      run: "helm upgrade --install catalogue -f values-dev.yaml -n roboshop --set deployment.imageVersion=${APP_VERSION} --atomic --wait --timeout=5m ."

    - name: Update Deploy status
      if: always()
      uses: daws-86s/workflows/.github/actions/update-commit-status@main
      with:
        sha: ${{ inputs.version }}
        state: ${{ steps.uat_deploy.outcome }}     # success / failure / cancelled
        context: UAT_DEPLOY
        description: ${{ steps.uat_deploy.outcome }}